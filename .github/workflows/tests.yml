name: tests

# Runs the full suite on every push to main and every pull request, so a change is
# verified by something other than the author remembering to run pytest.
#
# The suite is deliberately runnable WITHOUT the large local stores (gnomAD /
# AlphaMissense / full ClinVar): the committed fixtures — the gene-constraint table, the
# frozen ClinVar residue slice, and the self-contained annotated example VCFs — carry
# everything the tests need. So CI installs only the light dependency set and never
# touches the network, which is also a standing check that the offline path stays intact.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A new push to the same branch cancels the previous run — no point finishing a job
  # for a commit that has already been superseded.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      # Let every version report, rather than hiding the others behind the first failure.
      fail-fast: false
      matrix:
        # pyproject declares requires-python = ">=3.10"; test the floor and the versions
        # above it, so a change that quietly needs a newer syntax is caught here.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (light deps only — no duckdb/cyvcf2/mcp)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Show what is installed
        # The optional accelerators must be ABSENT here: the tests are supposed to pass on
        # the pure-Python fallbacks, and a silent dependency on duckdb/cyvcf2 would make CI
        # green while a fresh `pip install vcf2report` fails.
        run: pip list

      - name: Run the test suite
        run: pytest -q

  mcp:
    # The MCP SDK is an optional extra, so the light-install job above SKIPS the MCP tests —
    # and an untested surface is how a regression stripping PS1/PM5/PM1 from the MCP path
    # survived a green suite. This job installs the extra so that surface is actually covered.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with the MCP extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"

      - name: Run the MCP tests (must not skip here)
        # -rs reports skips; the tests are importorskip-guarded, so a silent skip would mean
        # the extra failed to install and this job proved nothing.
        run: pytest -q -rs tests/test_mcp_explore.py

  parquet:
    # Same lesson as the MCP job, and it already cost us: duckdb is an optional extra, so the
    # light-install job SKIPS every Parquet test — 34 of them, including the ones that guard
    # when the store may assert a variant is ABSENT from gnomAD. A fabricated absence fires
    # PM2 and over-calls, so that is the most safety-critical code in the annotation layer,
    # and it was running nowhere. A change to the absence sentinel landed green because of it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with the parquet extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,parquet]"

      - name: Run the Parquet tests (must not skip here)
        # -rs reports skips; these are importorskip-guarded, so a silent skip would mean the
        # extra failed to install and this job proved nothing.
        run: pytest -q -rs tests/test_gnomad_parquet.py tests/test_parquet_guard.py
             tests/test_parquet_wiring.py tests/test_build_gnomad_parquet.py

      - name: The whole suite, with duckdb present
        # The Parquet clients change behaviour when duckdb is importable, so the rest of the
        # suite must also pass in that configuration — not only in the light install.
        run: pytest -q

  tabix:
    # pysam was a hard import of four annotate modules and was declared by no extra, so
    # `pip install -e ".[dev]"` never brought it and two whole test modules — the entire
    # local-tabix path — skipped in every CI run. A skip reads as a pass. Same blind spot the
    # parquet job above exists to close.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with the tabix extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tabix]"

      - name: Run the tabix tests (must not skip here)
        run: pytest -q -rs tests/test_gnomad_local.py tests/test_clinvar_local.py
             tests/test_gnomad_remote.py tests/test_am_prime.py

      - name: The whole suite, with pysam present
        run: pytest -q

      - name: LIVE gnomAD over the public bucket — no fixture, no fake
        # Range-queries the real gnomAD v4.1 release with real pysam and asserts the real
        # frequency. This is the only test that would have caught the bug it guards: every
        # v4.1 lookup returned None because pysam RAISES on an undeclared INFO key, and a
        # hand-written fake only ever proves the author's model of pysam.
        # A network failure here fails the job on purpose — a skipped network test is exactly
        # the artefact this whole job exists to stop shipping.
        env:
          VCF2REPORT_ALLOW_NETWORK: "1"
          VCF2REPORT_LIVE_GNOMAD: "1"
          # pysam bundles its own libcurl, which does not inherit Python's CA store and on the
          # runner found no bundle at all — "Libcurl reported error 77 (Problem with the SSL CA
          # cert)". urllib worked fine over the same URL, which is why the module's own
          # reachability pre-check passed while every test failed.
          CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        run: pytest -q -rs tests/test_gnomad_live.py

  cli-smoke:
    # Unit tests import the package directly, so they would not notice a broken console
    # entry point or a packaging mistake. This installs and invokes the CLI the way a user
    # would, then runs a committed worked example end to end.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: CLI entry point responds
        run: vcf2report --help

      - name: Classify a shipped example end to end
        # data/example/*.annotated.vcf.gz are self-contained (gnomAD/ClinVar/AlphaMissense
        # baked into INFO), so this is a real report with no stores and no network.
        run: |
          python scripts/run_headless.py data/example/SYN-004.NIPBL.annotated.vcf.gz \
            --hpo data/example/SYN-004.hpo.txt \
            --sample-id CI-SYN-004 \
            --out "$RUNNER_TEMP/ci-report"
          test -s "$RUNNER_TEMP/ci-report/CI-SYN-004_report.md"
          test -s "$RUNNER_TEMP/ci-report/CI-SYN-004_results.json"

      - name: The example must still reach its expected call
        # A report that renders but classifies wrongly is the failure that matters. NIPBL
        # p.Arg1837* is a known Pathogenic in the committed example; assert the tier rather
        # than merely that a file appeared.
        run: |
          python - "$RUNNER_TEMP/ci-report/CI-SYN-004_results.json" <<'EOF'
          import json, sys
          data = json.load(open(sys.argv[1]))
          hit = next(c for c in data["classifications"] if c["variant"]["gene"] == "NIPBL")
          print(f"NIPBL {hit['variant']['hgvs_p']} -> {hit['tier']}")
          assert hit["tier"] == "Pathogenic", f"expected Pathogenic, got {hit['tier']}"
          EOF
