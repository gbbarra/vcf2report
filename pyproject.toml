[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vcf2report"
version = "0.1.0"
description = "Turn a raw exome VCF into a clinical-grade, auditable ACMG variant report — driven from Claude Desktop via Skills + MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Gustavo Barra" }]
keywords = ["genomics", "vcf", "acmg", "clinvar", "gnomad", "mcp", "claude"]

# Core runtime deps are intentionally light so the pipeline runs headless
# (tests + run_headless) without heavy bioinformatics wheels. cyvcf2/bcftools
# accelerate parsing in production but a pure-Python reader is the fallback.
dependencies = [
    "jinja2>=3.0",
]

[project.optional-dependencies]
# Faster/robust VCF handling for production (htslib-backed).
fast = ["cyvcf2>=0.30"]
# The MCP server that Claude Desktop connects to.
mcp = ["mcp[cli]>=1.2"]
# gnomAD as a local DuckDB/Parquet store (scripts/build_gnomad_parquet.py + the
# fast-path client); without it that path is simply off (tabix/remote still work).
parquet = ["duckdb>=0.9"]
# Indexed random access over bgzip+tabix files — htslib via pysam. Four annotate modules
# import it (gnomad_local, gnomad_remote, clinvar, alphamissense): the whole local-tabix path
# AND the remote range-query path that reads gnomAD's public bucket without downloading it.
# It was undeclared until now, so `pip install -e ".[dev]"` never brought it, two whole test
# modules silently skipped in CI, and docs/LOCAL_ANNOTATION.md called it "already a dep".
tabix = ["pysam>=0.22"]
# The live GraphQL/E-utilities clients use only the standard library.
# As ferramentas de qualidade abaixo implementam os gates do CLAUDE.md §4.6. Ficam aqui, e
# não instaladas ad hoc, porque um gate que só existe na máquina de quem rodou não é gate:
# durante o levantamento da linha de base o container reiniciou e apagou todas elas, e a
# medição deixou de ser reproduzível no meio do trabalho.
dev = ["pytest>=7.0", "hypothesis>=6.0",
       "pytest-cov>=5.0",       # §4.3 cobertura de branches
       "ruff>=0.6",             # §4.6 lint + formatação
       "mypy>=1.10",            # §4.6 tipagem estática
       "bandit>=1.7",           # §4.6 segurança
       "detect-secrets>=1.5"]   # §4.6 segredos commitados
# Sob demanda, fora do loop de desenvolvimento (§4.4 e §4.5): mutação e métricas.
qa = ["mutmut>=3.0", "radon>=6.0"]
all = ["cyvcf2>=0.30", "mcp[cli]>=1.2", "duckdb>=0.9", "pysam>=0.22",
       "pytest>=7.0", "hypothesis>=6.0", "pytest-cov>=5.0", "ruff>=0.6",
       "mypy>=1.10", "bandit>=1.7", "detect-secrets>=1.5"]

[project.scripts]
vcf2report = "vcf2report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
