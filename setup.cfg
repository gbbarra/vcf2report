# Configuração do mutmut (teste de mutação — CLAUDE.md §4.4).
#
# Arquivo separado do pyproject.toml de propósito: contém APENAS a seção [mutmut],
# é inerte para empacotamento, e mantém a configuração de uma ferramenta sob demanda
# fora do manifesto do pacote.
#
# Rodar:  python3 -m mutmut run     e depois     python3 -m mutmut results
#
# Escopo: os dois primeiros módulos críticos do CLAUDE.md §7.
#
#   acmg/rules.py     — combinador da Tabela 5, transforma critérios em tier. Fechado em
#                       quatro rodadas (PRs #37..#40): 38 sobreviventes, 0 inexplicados.
#                       Fica aqui para não regredir em silêncio.
#   acmg/criteria.py  — decide cada um dos 28 critérios. 100% de cobertura de branches
#                       pela suíte, o que pelo §4.3 não é argumento de nada: significa que
#                       toda linha RODA, e portanto que todo sobrevivente é uma linha que
#                       roda e cuja saída ninguém confere.
#
# Um mutante sobrevivente em qualquer um dos dois é uma classificação clínica errada que
# nenhum teste pega — o §4.4 trata isso como bloqueante.
#
# LIMITAÇÃO CONHECIDA, e é grande: o mutmut NÃO muta função decorada. Não é configurável —
# está no fonte dele (mutation/file_mutation.py, "ignore decorated functions", com exceção
# só para @staticmethod/@classmethod). Os 28 critérios carregam `@criterion("XX")`, então
# esta configuração mede **zero** dos 28 corpos de decisão: os 310 mutantes de criteria.py
# saem todos das 15 helpers de módulo (_benign_af, _pm1_signals, _insilico_direction,
# _clinvar_reviewed, _pm5_strength, _pvs1_strength, _judgment, _na, ...).
#
# Isso é bem menos ruim do que parece — boa parte da decisão clínica mora nas helpers, e a
# primeira rodada achou 10 lacunas reais ali — mas os corpos de pvs1/pm2/ba1/bs1/pp3/bp4 e
# companhia seguem SEM medição de mutação. Confirmado contando os mutantes gerados:
#   grep -oE "^def x_[a-z0-9_]+__mutmut_orig" mutants/src/vcf2report/acmg/criteria.py
# devolve as 15 helpers e nenhum dos 28.
#
# Destravar exige tirar o decorador (registrar os 28 num dict no fim do módulo). É mudança
# de produção para uma ferramenta enxergar, então fica para um PR próprio, com plano antes.
[mutmut]
source_paths = src/vcf2report

only_mutate =
    src/vcf2report/acmg/rules.py
    src/vcf2report/acmg/criteria.py

# Seleção de testes do runner. A suíte inteira leva ~1 min (mais os stores, quando montados);
# multiplicado por mais de mil mutantes seria inviável. Este subconjunto roda em ~16 s e
# cobre 100% dos branches de criteria.py e 97% dos de rules.py (a suíte completa: 100% e 98%).
#
# Dois arquivos ficam DE FORA de propósito, e nenhum dos dois custa cobertura:
#
#   test_silent_loss.py  — sozinho leva 17 s, mais que a seleção inteira. Os 85% de
#                          criteria.py que ele cobre já vêm dos outros arquivos.
#   test_audit_fixes.py  — entra por três node IDs, não pelo arquivo. Os testes que chamam
#                          `run_pipeline(config.SAMPLE_VCF)` falham na coleta de stats do
#                          mutmut: ele chama `pytest.main()` IN-PROCESS, e o
#                          `monkeypatch.setattr(config, "GNOMAD_PARQUET", None)` do conftest
#                          alcança uma instância do módulo diferente da que a pipeline usa,
#                          então a contagem de candidatos do sample_exome muda. Artefato do
#                          arranque do mutmut, não defeito do teste — os quatro seguem
#                          ativos na suíte, e só não entram nesta seleção.
#
#                          Os três que entram NÃO são opcionais: sem eles quatro mutantes de
#                          criteria.py "sobrevivem" aqui e morrem na suíte completa
#                          (_clinvar_reviewed or->and e caixa, _insilico_direction or->and).
#                          Terceira rodada seguida em que o sobrevivente era da ferramenta.
#
# Sem test_silent_loss.py e sem os quatro testes de pipeline a seleção ainda cobre 100% dos
# branches de criteria.py.
#
# test_integrity.py é OBRIGATÓRIO aqui e foi a lição da primeira rodada: sem ele a seleção
# cobria 92%, e o mutante `pm >= 1` -> `pm > 1` em LP-1 "sobreviveu" — o que teria sido
# reportado como lacuna grave (PVS1+PM2 caindo de Likely Pathogenic para VUS, o caminho de
# regra mais citado do projeto). A suíte completa mata esse mutante em
# test_integrity.py::test_acmg_combining_matrix. Era sobrevivente FALSO, artefato da
# seleção. Qualquer sobrevivente daqui ainda deve ser confirmado contra a suíte completa
# antes de virar afirmação.
#
# test_property.py entrou pela MESMA razão, uma rodada depois: `1 <= pm <= 2` -> `1 <= pm < 2`
# (a faixa de LP-2) sobreviveu à seleção e é morto por
# test_property.py::test_more_pathogenic_evidence_never_more_benign — uma propriedade
# Hypothesis de monotonicidade, não um exemplo. Custa 1,8 s. Duas rodadas seguidas em que o
# sobrevivente era da ferramenta, não do código: confirme SEMPRE contra a suíte completa.
pytest_add_cli_args_test_selection =
    tests/test_acmg_rules.py
    tests/test_criteria_invariants.py
    tests/test_acmg_model.py
    tests/test_conflict_gate.py
    tests/test_bp6.py
    tests/test_evidence_honesty.py
    tests/test_integrity.py
    tests/test_property.py
    tests/test_acmg_coverage.py
    tests/test_audit_fixes.py::test_pp5_review_status_gate
    tests/test_audit_fixes.py::test_clinvar_is_pp5_supporting_not_ps1_strong
    tests/test_audit_fixes.py::test_insilico_conflict_fires_neither_pp3_nor_bp4
    tests/test_audit2_fixes.py
    tests/test_stability_fixes.py
    tests/test_ps1_pm5.py
    tests/test_pm1_hotspot.py
    tests/test_pp2_bp1.py
    tests/test_pvs1_modulation.py
    tests/test_alphamissense_v2.py
    tests/test_annotate_absence.py
    tests/test_inframe_indel.py
    tests/unit/acmg/

# Dados que os testes leem. Os stores parquet (gnomAD 1,4 GB, AlphaMissense 1,2 GB,
# ClinVar 60 MB) ficam DE FORA: o conftest já os desliga (GNOMAD_PARQUET=None, OFFLINE=1)
# e copiá-los por mutante seria inviável.
also_copy =
    data/hpo
    data/constraint
    data/concordance
    data/sample
    data/example
    templates
    # 380 KB. test_acmg_coverage.py confere docs/ACMG_CRITERIA.md contra o registro dos 28
    # critérios; sem isto a coleta de stats do mutmut aborta com FileNotFoundError.
    docs
    # config.DATA_DIR é derivado de __file__, então dentro de mutants/ ele aponta para
    # mutants/data — o que não estiver listado aqui simplesmente não existe para os testes.
    # data/clinvar entra pelo índice de resíduos congelado (43 KB), que PS1/PM5/PM1 leem:
    # sem ele test_ps1_pm5.py falha na coleta de stats. O `also_copy` do mutmut não cria
    # diretório-pai, então não dá para listar só esse arquivo — vai a pasta inteira, com o
    # store parquet junto. É cópia ÚNICA, no início da rodada, não por mutante.
    data/insilico
    data/clinvar
    # 588 KB. test_annotate_absence.py invoca scripts/warm_cache.py como subprocesso.
    scripts
